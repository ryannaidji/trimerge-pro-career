# Lint, test and build both apps on every push and pull request
name: CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets · gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free, open-source scanner run from its Docker image (no license needed)
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner

  api:
    name: API · test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      # Tests use mongodb-memory-server; the example env only provides placeholder values
      - run: cp .env.example .env
      - run: npm test
      - run: npm run build

  web:
    name: Web · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Existing lint errors predate CI; non-blocking until they are fixed
      - run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  e2e:
    name: E2E · workflows & browser smoke tests
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Local-only configuration: console email, local storage, random JWT secrets
      - name: Create API env file
        run: |
          cp apps/api/.env.example apps/api/.env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 48)|; s|^JWT_REFRESH_SECRET=.*|JWT_REFRESH_SECRET=$(openssl rand -hex 48)|" apps/api/.env
      - name: Start the Docker stack
        run: |
          docker compose up -d --build --wait
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && curl -sf http://localhost:4000/health >/dev/null && exit 0; sleep 2; done
          docker compose logs --no-color --tail 100; exit 1
      - name: Create a test admin
        run: docker compose exec -T -e ADMIN_EMAIL=admin@trimerge.local -e ADMIN_PASSWORD='Admin-Local-2026!' api node dist/scripts/create-admin.js
      - name: Workflow checks (candidate, employer, admin, access control)
        run: node scripts/e2e-workflows.mjs
      - name: Browser smoke tests (Playwright)
        working-directory: e2e
        env:
          PW_CHANNEL: ""
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

